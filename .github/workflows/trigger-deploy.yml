name: Trigger Frontend Deploy

on:
  push:
    branches: [main, dev]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger frontend deploy
        run: |
          BRANCH="${{ secrets.FRONTEND_BRANCH }}"
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ secrets.FRONTEND_REPO_OWNER }}/${{ secrets.FRONTEND_REPO_NAME }}/dispatches" \
            -d "{\"event_type\":\"content-update\",\"client_payload\":{\"branch\":\"${BRANCH}\"}}"