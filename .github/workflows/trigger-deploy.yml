name: Trigger Frontend Deploy

on:
  push:
    branches: [main, dev]

# 同一时间只允许一个调度，新的 push 会取消进行中的
concurrency:
  group: trigger-deploy
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger frontend deploy
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ vars.FRONTEND_REPO_OWNER }}/${{ vars.FRONTEND_REPO_NAME }}/dispatches" \
            -d "{\"event_type\":\"content-update\",\"client_payload\":{\"branch\":\"${{ vars.FRONTEND_BRANCH }}\"}}" \
            -w "\n%{http_code}" | tail -1