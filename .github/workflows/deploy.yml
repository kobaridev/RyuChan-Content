name: Notify Frontend Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to frontend repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.FRONTEND_PAT }}
          repository: kobaridev/RyuChan
          event-type: content-update
          client-payload: '{"source": "content", "ref": "${{ github.ref }}"}'
